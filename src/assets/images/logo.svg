<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" aria-labelledby="logo-title" role="img">
  <title id="logo-title">Image Cleaning - Professional Cleaning Services</title>
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#134E4B"/>
    </linearGradient>
  </defs>
  
  <!-- Monogram Icon -->
  <g>
    <!-- Outer circle -->
    <circle cx="32" cy="32" r="28" fill="url(#logoGrad)"/>
    <!-- Inner subtle ring -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    
    <!-- Stylized "IC" monogram -->
    <text x="32" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="-1">IC</text>
    
    <!-- Sparkle accent (cleanliness) -->
    <g fill="#F59E0B">
      <path d="M46 18 L48 22 L52 22 L48.5 25 L50 30 L46 27 L42 30 L43.5 25 L40 22 L44 22 Z"/>
    </g>
  </g>

  <!-- Company Name -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#134E4B">
    <!-- "Image" -->
    <text x="72" y="28" font-size="22" font-weight="700" letter-spacing="-0.5">Image</text>
    <!-- "Cleaning" -->
    <text x="72" y="50" font-size="22" font-weight="600" letter-spacing="-0.3" fill="#0D9488">Cleaning</text>
  </g>
</svg>
